name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    runs-on: macos-15
    name: macOS (arm64 + x86_64)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Core ML vocoder
        # Not in the repo. Published by PitchNet; the checksum pins the content.
        run: |
          curl -fL -o pc_nsf_hifigan.mlmodelc.zip "https://github.com/SessionLoops/PitchNet/releases/download/models/pc_nsf_hifigan.mlmodelc.zip"
          echo "e511eca773fd4fc484da1ee5a5ff2bf745156587194e0dceb90f4b5c6227e341  pc_nsf_hifigan.mlmodelc.zip" | shasum -a 256 -c -
          unzip -q pc_nsf_hifigan.mlmodelc.zip -d Resources/models/
          rm pc_nsf_hifigan.mlmodelc.zip

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        run: |
          mkdir package
          cp -R "build/PitchNet_artefacts/${{ env.BUILD_TYPE }}/Sonaria.app" package/
          cp -R "build/PitchNetPlugin_artefacts/${{ env.BUILD_TYPE }}/VST3/Sonaria.vst3" package/
          cp -R "build/PitchNetPlugin_artefacts/${{ env.BUILD_TYPE }}/AU/Sonaria.component" package/
          ditto -c -k --keepParent package Sonaria-macOS.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonaria-macOS
          path: Sonaria-macOS.zip
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    name: Windows (CPU)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DUSE_DIRECTML=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: Sonaria-Windows-Standalone
          path: build/PitchNet_artefacts/${{ env.BUILD_TYPE }}/
          retention-days: 30

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Sonaria-Windows-VST3
          path: build/PitchNetPlugin_artefacts/${{ env.BUILD_TYPE }}/VST3/
          retention-days: 30
