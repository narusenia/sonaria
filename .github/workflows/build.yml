name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    runs-on: macos-15
    name: macOS (arm64 + x86_64)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Core ML vocoder
        # Not in the repo. Published by PitchNet; the checksum pins the content.
        run: |
          curl -fL -o pc_nsf_hifigan.mlmodelc.zip "https://github.com/SessionLoops/PitchNet/releases/download/models/pc_nsf_hifigan.mlmodelc.zip"
          echo "e511eca773fd4fc484da1ee5a5ff2bf745156587194e0dceb90f4b5c6227e341  pc_nsf_hifigan.mlmodelc.zip" | shasum -a 256 -c -
          unzip -q pc_nsf_hifigan.mlmodelc.zip -d Resources/models/
          rm pc_nsf_hifigan.mlmodelc.zip

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        run: |
          VERSION=$(sed -n 's/^project(PitchNet VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          packaging/macos/build_pkg.sh "$VERSION" build dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonaria-macOS
          path: dist/*
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    name: Windows (CPU)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DUSE_DIRECTML=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(PitchNet VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $name = "Sonaria-$version-Windows"
          $stage = "stage\$name"
          New-Item -ItemType Directory -Force $stage, dist | Out-Null
          # Release builds also find a "models" folder next to the exe, so the zip runs in place.
          Copy-Item build\PitchNet_artefacts\Release\Sonaria.exe, build\PitchNet_artefacts\Release\*.dll, LICENSE, THIRD_PARTY_NOTICES.txt $stage
          Copy-Item -Recurse build\PitchNetPlugin_artefacts\Release\VST3\Sonaria.vst3, Resources\models $stage
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$version" packaging\windows\PitchNet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item Output\*.exe dist\
          Get-ChildItem dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonaria-Windows
          path: dist/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    name: Draft release
    permissions:
      contents: write

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Sonaria ${GITHUB_REF_NAME#v}" \
            --notes "Unsigned build. See README for install steps."
